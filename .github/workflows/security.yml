
name: Security Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source /repo --exit-code 1

      - name: SAST Scan (Semgrep)
        run: |
          pip install semgrep
          semgrep scan --config p/python --config p/security-audit .

      - name: Dependency Scan (Trivy)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            aquasec/trivy:latest \
            fs --scanners vuln --exit-code 0 /repo

      - name: Enforce Secret Scan Gate
        if: always()
        env:
          GITLEAKS_RESULT: ${{ steps.gitleaks.outcome }}
        run: |
          if [ "$GITLEAKS_RESULT" != "success" ]; then
            echo "Gitleaks failed: blocking build."
            exit 1
          fi
